# Default aria2 configuration.
#
# This file is copied to /aria2/conf/aria2.conf on first start only.
# Edit the copy in the volume and restart the container to customize it.
#
# RPC is bound to loopback on purpose: althttpd proxies /jsonrpc to it, so the
# RPC port never has to be published. Use RPC_SECRET and/or the HTTP basic auth
# options if the web UI is reachable by other people.

enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-allow-origin-all=true
rpc-max-request-size=16M

dir=/aria2/data
continue=true
file-allocation=prealloc
max-concurrent-downloads=5
max-connection-per-server=16
min-split-size=10M
split=16

max-overall-download-limit=0
max-download-limit=0
max-overall-upload-limit=0
max-upload-limit=0

# Session persistence
input-file=/aria2/conf/aria2.session
save-session=/aria2/conf/aria2.session
save-session-interval=30
force-save=true

# BitTorrent
enable-dht=true
bt-enable-lpd=true
bt-save-metadata=true
bt-load-saved-metadata=true
follow-torrent=mem
seed-ratio=1.0

# Best trackers, source: https://github.com/ngosang/trackerslist
bt-tracker=http://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://tracker.torrent.eu.org:451/announce,udp://open.tracker.cl:1337/announce,udp://open.demonii.com:1337/announce,udp://exodus.desync.com:6969/announce,udp://tracker.qu.ax:6969/announce,udp://tracker.ducks.party:1984/announce,udp://tracker.bittor.pw:1337/announce,udp://tracker.corpscorp.online:80/announce,udp://tracker.nyaa.vc:6969/announce,udp://tracker-udp.gbitt.info:80/announce,udp://tracker2.dler.org:80/announce,http://tracker.dler.org:6969/announce,http://tracker.dler.com:6969/announce,udp://explodie.org:6969/announce,udp://retracker01-msk-virt.corbina.net:80/announce,udp://tracker.gmi.gd:6969/announce,http://tracker.renfei.net:8080/announce,udp://tracker.peerfect.org:6969/announce

# Logging (visible through `docker logs`)
console-log-level=notice
summary-interval=0
